# Local development config (scripts/dev-livekit.ps1). Keys come from the
# LIVEKIT_KEYS environment variable, never from this file.
port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 7881
  # Single UDP port (UDP mux) instead of a 10k port range.
  udp_port: 7882
  # No node_ip: LiveKit announces the machine's LAN addresses, which is what
  # the UDP mux actually listens on (it does not bind loopback).
  use_external_ip: false
room:
  empty_timeout: 60
  departure_timeout: 20
  auto_create: true
webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:3000/api/livekit/webhook
logging:
  level: info
