name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: Server (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p nexus-server --all-targets --locked -- -D warnings
      - run: cargo test -p nexus-server --locked
      - name: Build release binary
        run: cargo build -p nexus-server --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-server-linux-x64
          path: target/release/nexus-server

  web:
    name: TypeScript (typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @nexus/desktop

  desktop:
    name: Windows app (Tauri)
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rust fmt + clippy (desktop + Windows tools)
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy -p nexus-bench -p nexus-noise-bench --all-targets -- -D warnings
      - name: Build installer
        run: npm run tauri --workspace @nexus/desktop -- build
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android app
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/android/package-lock.json
      - run: npm ci  # root workspace: deps used when type-checking packages/*
      - name: "Install (the Android app has its own npm project; shared packages are file links)"
        working-directory: apps/android
        run: npm ci
      - working-directory: apps/android
        run: npm run typecheck
      - working-directory: apps/android
        run: npx jest
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble APK
        working-directory: apps/android/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk
          path: apps/android/android/app/build/outputs/apk/release/*.apk
