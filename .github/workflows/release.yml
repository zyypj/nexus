# Builds and publishes a release when a tag like v0.2.0 is pushed
# (create it with `node scripts/release.mjs 0.2.0`).
#
# Release assets, consumed by the auto-updaters:
#   nexus-server-linux-x86_64.tar.gz (+ .sha256), VERSION   -> Pterodactyl egg (nexus-start.sh)
#   nexus-start.sh, livekit-start.sh, egg-*.json            -> Pterodactyl install scripts
#   Nexus_<v>_x64-setup.exe (+ .sig), latest.json           -> Windows updater (tauri-plugin-updater)
#   nexus-android.apk                                       -> Android updater
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   (required, Windows updates)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD                        (recommended, Android signing)
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version from tag must match the manifests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/set-version.mjs "$VERSION" --check
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - id: release
        # Pre-release while building: updaters and ".../releases/latest" ignore
        # it, and unlike drafts its asset URLs already use the final tag.
        name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease --verify-tag \
            --title "Nexus ${{ steps.v.outputs.version }}" --generate-notes
          echo "id=$(gh api "repos/${{ github.repository }}/releases/tags/$GITHUB_REF_NAME" --jq .id)" >> "$GITHUB_OUTPUT"

  server:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test -p nexus-server --locked
      - name: Build static binary (musl, runs on any x86_64 Linux / Pterodactyl image)
        run: cargo build -p nexus-server --release --locked --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          mkdir -p dist stage
          cp target/x86_64-unknown-linux-musl/release/nexus-server stage/
          cp infrastructure/pterodactyl/nexus-start.sh stage/
          chmod +x stage/*
          tar -czf dist/nexus-server-linux-x86_64.tar.gz -C stage nexus-server nexus-start.sh
          (cd dist && sha256sum nexus-server-linux-x86_64.tar.gz > nexus-server-linux-x86_64.tar.gz.sha256)
          echo "${{ needs.prepare.outputs.version }}" > dist/VERSION
          cp infrastructure/pterodactyl/nexus-start.sh infrastructure/pterodactyl/livekit-start.sh dist/
          cp infrastructure/pterodactyl/egg-*.json dist/
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  desktop:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build, sign and upload installer + latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/android/package-lock.json
      - run: npm ci
      - working-directory: apps/android
        run: npm ci
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexus.keystore"
            echo "NEXUS_KEYSTORE=$RUNNER_TEMP/nexus.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set: the APK is signed with the public debug key"
          fi
      - name: Assemble release APK
        working-directory: apps/android/android
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk nexus-android.apk
          gh release upload "$GITHUB_REF_NAME" nexus-android.apk --clobber

  publish:
    needs: [prepare, server, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Promote to latest (only now do the auto-updaters see it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "${{ github.repository }}" --prerelease=false --latest
